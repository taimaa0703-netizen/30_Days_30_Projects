<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quest Studio · CLASSVERSE</title><link rel="stylesheet" href="/quest-studio.css?v=3"><link rel="stylesheet" href="/studio-unified.css?v=3"></head><body><header><a href="/teacher.html">✦ CLASSVERSE</a><span>QUEST STUDIO <small>School Edition</small></span><select id="lang" aria-label="Language"><option value="he">עברית</option><option value="ar">العربية</option><option value="en">English</option></select></header><div class="studio-shortcuts"><a href="/teacher.html">✦ Teacher Studio</a><a href="/arena.html">⚡ Live Arena / PIN</a><a href="/academy.html">🧭 Academy</a></div><main><aside><div class="eyebrow" data-i="myQuests">המסלולים שלי</div><button id="new" class="primary" data-i="newQuest">+ מסלול חדש</button><button id="sample" class="outline" data-i="sampleQuest">✦ מסלול לדוגמה</button><div id="saved"></div><p class="hint" data-i="private">המסלולים נשמרים בחשבון המורה שלך ב־Neon.</p></aside><section class="workspace"><div class="intro"><span class="eyebrow">CLASSVERSE / QUEST BUILDER</span><h1 data-i="headline">בונים עולם. לא עוד שאלון.</h1><p data-i="subtitle">מגדירים מטרות לימוד, משימות, שאלות ותנאי מעבר. כל מסלול נשמר כטיוטה פרטית למורה.</p></div><div id="message" role="status"></div><div class="panel"><div class="row"><label><span data-i="title">שם המסלול</span><input id="title" maxlength="100" placeholder="מסע אל האנרגיה"></label><label><span data-i="subject">מקצוע</span><select id="subject"><option value="science" data-subject="science">מדעים</option><option value="math" data-subject="math">מתמטיקה</option><option value="language" data-subject="language">שפה</option><option value="history" data-subject="history">היסטוריה</option><option value="cs" data-subject="cs">מדעי המחשב</option></select></label></div><label><span data-i="description">תיאור המסלול</span><textarea id="description" rows="2" maxlength="500"></textare
