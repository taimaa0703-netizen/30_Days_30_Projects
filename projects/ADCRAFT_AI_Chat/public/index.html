<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADCRAFT AI — Creative chat</title><meta name="theme-color" content="#f8f8fb"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="side-top"><a class="logo" href="/"><span class="logo-icon">✳</span><span>ADCRAFT<span class="ai"> AI</span></span></a><button id="sideClose" class="icon-only mobile" aria-label="Close">×</button></div><button class="new-chat" id="newChat"><span>＋</span><span data-i18n="newChat">שיחה חדשה</span></button><div class="sidebar-label" data-i18n="history">השיחות שלך</div><div id="history" class="history"></div><div class="side-bottom"><div class="mode-mini"><div class="mini-led"></div><span data-i18n="creativeAI">Creative intelligence studio</span></div><button id="exportAll" class="side-link"><span>↓</span><span data-i18n="export">הורדת שיחות</span></button><div class="local-note" data-i18n="localNote">השיחות נשמרות בדפדפן הזה בלבד</div></div></aside><div class="overlay" id="overlay"></div><section class="main"><header class="topbar"><div class="top-left"><button class="icon-only mobile" id="menuBtn" aria-label="Open menu">☰</button><div class="top-title"><strong>ADCRAFT AI</strong><span class="top-dot">✦</span></div><span class="top-status" id="status">● Demo</span></div><div class="top-right"><div class="mode-switch" role="group" aria-label="Working mode"><button type="button" id="creatorMode" class="mode active" data-mode="creator">Creator <span>✳</span></button><button type="button" id="agencyMode" class="mode" data-mode="agency">Agency <span>▦</span></button></div><button id="langBtn" class="lang-btn" title="Switch language">EN</button></div></header><div class="messages" id="messages" aria-live="polite"><div id="messagesInner" class="messages-inner"></div></div><div class="composer-area"><div class="composer-wrap"><form id="chatForm" class="composer"><textarea id="promptInput" rows="1" placeholder="מה ניצור היום?" aria-label="Your message"></textarea><div class="compose-bottom"><div class="compose-note">✦ <span id="composeMode">Creator Mode</span></div><button type="submit" id="sendBtn" class="send-btn" aria-label="Send message" title="Send">↑</button></div></form><p class="footnote" data-i18n="disclaimer">ADCRAFT AI יכול לטעות. כדאי לבדוק פרטים לפני פרסום.</p></div></div></section></div><div id="toast" role="status"></div></body></html>
