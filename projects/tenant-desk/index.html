const prioBadge=s=>badge(t(s),s==='high'?'red':s==='medium'?'amber':'gray');
function ticketTable(tickets){return `<div class="tablewrap"><table><thead><tr>${['title','property','priority','status','due','amount',''].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>${tickets.map(x=>`<tr><td><strong>${esc(x.title)}</strong><div class="mini">#${x.id} · ${esc(x.unit)}</div></td><td>${esc(prop(x.propertyId)?.name||'—')}</td><td>${prioBadge(x.priority)}</td><td>${statusBadge(x.status)}</td><td>${esc(x.due)}</td><td>${money(x.cost)}</td><td><button class="btn secondary sm" onclick="editTicket(${x.id})">${t('view')}</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">${t('empty')}</td></tr>`}</tbody></table></div>`}
const views={overview(){let open=data.tickets.filter(x=>x.status!=='resolved'),resolved=data.tickets.filter(x=>x.status==='resolved');return `<div class="statgrid">${stat(t('total'),open.length,'Across all properties')}${stat(t('urgent'),open.filter(x=>x.priority==='high').length,'High priority')}${stat(t('cost'),money(data.tickets.reduce((a,b)=>a+(+b.cost||0),0)),'Recorded + estimated')}${stat(t('units'),data.properties.reduce((a,b)=>a+(+b.units||0),0),'Across '+data.properties.length+' properties')}</div><div class="grid2"><section class="card"><div class="cardhead"><div><h2>${t('activity')}</h2><p>End-to-end resolution tracking</p></div><button class="btn secondary sm" onclick="go('tickets')">${t('view')} →</button></div>${ticketTable(data.tickets.slice().sort((a,b)=>b.id-a.id).slice(0,5))}</section><section class="card"><div class="cardhead"><h2>${t('exposure')}</h2>${badge(money(open.reduce((n,x)=>n+(+x.cost||0),0)))}</div><div class="stack">${['plumbing','electric','heating','appliance','other'].map(c=>{let sum=open.filter(x=>x.category===c).reduce((n,x)=>n+(+x.cost||0),0);return `<div><div class="row"><span>${t(c)}</span><strong>${money(sum)}</strong></div><div style="margin-top:8px" class="progress"><i style="width:${Math.round(sum/Math.max(1,open.reduce((n,x)=>n+(+x.cost||0),0))*100)}%"></i></div></div>`}).join('')}</div><div class="line"></div><div class="row"><span>${t('sla')}</span>${badge(open.filter(x=>x.due<today()).length,'red')}</div></section></div><div class="footnote">${t('note')} Financial exposure uses entered cost estimates, not confirmed losses.</div>`},tickets(){return `<section class="card"><div class="cardhead"><h2>${t('tickets')}</h2><div class="actions"><span class="mini">${t('role')}</span><select id="role" style="width:auto"><option value="landlord" ${role==='landlord'?'selected':''}>${t('landlord')}</option><option value="tenant" ${role==='tenant'?'selected':''}>${t('tenant')}</option></select></div></div><div class="searchbar"><input type="search" id="ticketSearch" placeholder="${t('title')}"><select id="ticketStatus"><option value="all">${t('all')}</option>${['new','inprogress','resolved'].map(k=>`<option value="${k}">${t(k)}</option>`).join('')}</select></div><div id="ticketResults">${ticketTable(data.tickets)}</div></section>`},properties(){return `<section class="card"><div class="cardhead"><h2>${t('properties')}</h2><button class="btn" onclick="newProperty()">+ ${t('addproperty')}</button></div><div class="grid2">${data.properties.map(p=>`<div style="border:1px solid var(--line);border-radius:15px;padding:20px"><div class="row"><span class="avatar">⌂</span>${badge(p.units+' '+t('units'))}</div><h2 style="margin:13px 0 2px">${esc(p.name)}</h2><div class="sub">${esc(p.address)}</div><div class="line"></div><div class="row"><span class="mini">${t('total')}</span><b>${data.tickets.filter(x=>x.propertyId===p.id&&x.status!=='resolved').length}</b></div><div class="row"><span class="mini">${t('cost')}</span><b>${money(data.tickets.filter(x=>x.propertyId===p.id).reduce((n,x)=>n+(+x.cost||0),0))}</b></div><button class="btn secondary sm" style="margin-top:12px" onclick="showProperty(${p.id})">${t('history')}</button></div>`).join('')}</div></section>`},vendors(){return `<section class="card"><div class="cardhead"><h2>${t('vendors')}</h2><button class="btn" onclick="newVendor()">+ ${t('addvendor')}</button></div><div class="tablewrap"><table><thead><tr><th>${t('name')}</th><th>${t('category')}</th><th>${t('phone')}</th><th>${t('total')}</th></tr></thead><tbody>${data.vendors.map(v=>`<tr><td><strong>${esc(v.name)}</strong></td><td>${t(v.category)}</td><td>${esc(v.phone)}</td><td>${data.tickets.filter(x=>x.vendorId===v.id).length}</td></tr>`).join('')}</tbody></table></div></section>`},history(){let done=data.tickets.filter(x=>x.status==='resolved');return `<div class="statgrid">${stat(t('resolved'),done.length,'Completed maintenance')}${stat(t('cost'),money(done.reduce((n,x)=>n+(+x.cost||0),0)),'Completed work')}${stat(t('properties'),data.properties.length,'Buildings')}${stat(t('total'),data.tickets.length,'Lifetime requests')}</div><section class="card"><div class="cardhead"><h2>${t('historytitle')}</h2>${badge(done.length+' '+t('resolved'))}</div>${ticketTable(done)}<div class="footnote">Use the request editor to attach before/after images.</div></section>`}};
function bindPage(){if(page==='tickets'){let roleEl=$('#role');roleEl.onchange=e=>{role=e.target.value;localStorage.setItem('tenantdesk_role',role);toast(t('role')+': '+t(role))};let update=()=>{let q=$('#ticketSearch').value.toLowerCase(),s=$('#ticketStatus').value;$('#ticketResults').innerHTML=ticketTable(data.tickets.filter(x=>(s==='all'||x.status===s)&&(x.title+' '+x.unit+' '+(prop(x.propertyId)?.name||'')).toLowerCase().includes(q)))};$('#ticketSearch').oninput=update;$('#ticketStatus').onchange=update}}
function go(p){page=p;render()}
async function readImage(file){if(!file)return '';if(file.size>1024*1024){toast('Use an image smaller than 1 MB');return ''}return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
function ticketForm(x={}){return `<form id="ticketForm" class="formgrid">${field('title',t('title'),'text',x.title||'')}${field('propertyId',t('property'),'select',String(x.propertyId||data.properties[0]?.id),data.properties.map(p=>[String(p.id),p.name]))}${field('unit',t('unit'),'text',x.unit||'')}${field('tenant',t('tenant'),'text',x.tenant||'')}${field('category',t('category'),'select',x.category||'plumbing',['plumbing','electric','heating','appliance','other'].map(k=>[k,t(k)]))}${field('priority',t('priority'),'select',x.priority||'medium',['low','medium','high'].map(k=>[k,t(k)]))}${field('status',t('status'),'select',x.status||'new',['new','inprogress','resolved'].map(k=>[k,t(k)]))}${field('vendorId',t('assigned'),'select',String(x.vendorId||0),[['0','—'],...data.vendors.map(v=>[String(v.id),v.name])])}${field('due',t('due'),'date',x.due||today())}${field('cost',t('amount'),'number',x.cost||0)}${field('description',t('issue'),'textarea',x.description||'')}${field('notes',t('notes'),'textarea',x.notes||'')}<label class="field">${t('before')}<input type="file" accept="image/*" name="before"></label><label class="field">${t('after')}<input type="file" accept="image/*" name="after"></label>${x.before?`<div><div class="mini">${t('before')}</div><img alt="Before" src="${x.before}" style="width:100%;max-height:150px;object-fit:cover;border-radius:10px"></div>`:''}${x.after?`<div><div class="mini">${t('after')}</div><img alt="After" src="${x.after}" style="width:100%;max-height:150px;object-fit:cover;border-radius:10px"></div>`:''}<div class="actions field full"><button class="btn">${t('save')}</button>${x.id?`<button type="button" class="btn warn" id="deleteTicket">${t('delete')}</button>`:''}</div></form>`}
function ticketEditor(id){let x=data.tickets.find(z=>z.id===id),isNew=!x;if(!x)x={};openModal(ticketForm(x));$('#ticketForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let o={};for(let k of ['title','unit','tenant','category','priority','status','due','description','notes'])o[k]=String(f.get(k)||'');for(let k of ['propertyId','vendorId','cost'])o[k]=+f.get(k)||0;for(let k of ['before','after'])o[k]=(await readImage(f.get(k)))||x[k]||'';o.updated=today();if(isNew){o.id=Date.now();o.created=today();data.tickets.unshift(o)}else Object.assign(x,o);try{save()}catch(err){toast('Storage full: try smaller images');return}closeModal();render();toast(t('save'))};if(!isNew)$('#deleteTicket').onclick=()=>{if(confirm(t('delete')+'?')){data.tickets=data.tickets.filter(a=>a.id!==id);save();closeModal();render()}}}
function editTicket(id){ticketEditor(id)}function addNew(){ticketEditor()}
function newProperty(){openModal(`<form id="propertyForm" class="formgrid">${field('name',t('name'))}${field('address',t('address'))}${field('units',t('units'),'number','1')}<div class="field full"><button class="btn">${t('save')}</button></div></form>`);$('#propertyForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.properties.push({id:Date.now(),name:String(f.get('name')),address:String(f.get('address')),units:+f.get('units')});save();closeModal();render()}}
function newVendor(){openModal(`<form id="vendorForm" class="formgrid">${field('name',t('name'))}${field('phone',t('phone'))}${field('category',t('category'),'select','plumbing',['plumbing','electric','heating','appliance','other'].map(k=>[k,t(k)]))}<div class="field full"><button class="btn">${t('save')}</button></div></form>`);$('#vendorForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.vendors.push({id:Date.now(),name:String(f.get('name')),phone:String(f.get('phone')),category:String(f.get('category'))});save();closeModal();render()}}
function showProperty(id){page='history';render();$('#view').innerHTML=`<section class="card"><div class="cardhead"><h2>${esc(prop(id)?.name)}</h2><button class="btn secondary sm" onclick="render()">← ${t('history')}</button></div>${ticketTable(data.tickets.filter(x=>x.propertyId===id))}</section>`}
function exportCSV(){csvDownload([['ID','Title','Property','Unit','Tenant','Category','Priority','Status','Vendor','Due','Cost','Created','Updated','Notes'],...data.tickets.map(x=>[x.id,x.title,prop(x.propertyId)?.name,x.unit,x.tenant,x.category,x.priority,x.status,vendor(x.vendorId)?.name,x.due,x.cost,x.created,x.updated,x.notes])],'tenant_desk_requests')}
init();
</script><script src="tenant-tools.js"></script></body></html>
