const bar=v=>`<div class="progress"><i style="width:${Math.max(0,Math.min(100,+v))}%"></i></div>`;
const studentRow=s=>`<tr><td><span class="avatar">${esc(s.name[0])}</span><strong>${esc(s.name)}</strong></td><td>${avg(s)}% ${bar(avg(s))}</td><td>${attPct(s.id)}%</td><td>${completion(s.id)}%</td><td>${badge(t(level(s)),level(s)==='low'?'red':level(s)==='mid'?'amber':'')}</td><td><button class="btn secondary sm" onclick="editStudent(${s.id})">${t('view')}</button></td></tr>`;
const studentTable=ss=>`<div class="tablewrap"><table><thead><tr>${['name','grade','att','done','risk',''].map(x=>`<th>${t(x)}</th>`).join('')}</tr></thead><tbody>${ss.map(studentRow).join('')||`<tr><td colspan="6" class="empty">${t('norecord')}</td></tr>`}</tbody></table></div>`;
function insight(s){let scores=[['math',s.math],['reading',s.reading],['science',s.science]].sort((a,b)=>a[1]-b[1]);let weak=t(scores[0][0]);return lang==='he'?`תרגול ממוקד ב${weak} ובדיקת הבנה קצרה בשיעור הבא.`:lang==='ar'?`تمارين مركزة في ${weak} ومراجعة قصيرة في الحصة القادمة.`:`Offer a focused ${weak} practice set and a quick check-in next lesson.`}
const views={overview(){let ss=data.students,at=ss.length?Math.round(ss.reduce((n,s)=>n+avg(s),0)/ss.length):0,missing=data.assignments.reduce((n,a)=>n+ss.length-a.completed.length,0);return `<div class="statgrid">${stat(t('total'),ss.length,'Active learners')}${stat(t('avg'),at+'%','Across 3 subjects')}${stat(t('miss'),missing,'Across assignments')}${stat(t('flag'),ss.filter(s=>level(s)==='low').length,'Below 60% mastery')}</div><div class="grid2"><section class="card"><div class="cardhead"><div><h2>${t('classmap')}</h2><p>${t('assess')}</p></div>${badge('LIVE LOCAL')}</div>${mapView()}</section><section class="card"><div class="cardhead"><h2>${t('recommendations')}</h2></div><div class="stack">${ss.filter(s=>level(s)!=='high').sort((a,b)=>avg(a)-avg(b)).slice(0,4).map(s=>`<div><div class="row"><b>${esc(s.name)}</b>${badge(t(level(s)),level(s)==='low'?'red':'amber')}</div><div class="mini">${insight(s)}</div></div>`).join('<div class="line"></div>')||t('norecord')}</div></section></div><section class="card"><div class="cardhead"><h2>${t('students')}</h2><button class="btn secondary sm" onclick="go('students')">${t('view')} →</button></div>${studentTable(ss.slice(0,6))}</section><div class="footnote">${t('privacy')}</div>`},students(){return `<section class="card"><div class="cardhead"><div><h2>${t('students')}</h2><p>${data.students.length} records</p></div><button class="btn secondary sm" onclick="resetDemo()">${t('clear')}</button></div><div class="searchbar"><input type="search" id="search" placeholder="${t('search')}"></div><div id="studentResults">${studentTable(data.students)}</div></section>`},attendance(){let date=new Date().toISOString().slice(0,10);return `<section class="card"><div class="cardhead"><div><h2>${t('attendance')}</h2><p>${t('attendance_sub')}</p></div><input type="date" id="attDate" value="${date}" style="width:auto"></div><div id="attList"></div><button class="btn" id="saveAtt">${t('saveatt')}</button></section>`},assignments(){return `<section class="card"><div class="cardhead"><h2>${t('classwork')}</h2><button class="btn" onclick="newAssignment()">+ ${t('create')}</button></div><div class="stack">${data.assignments.map(a=>`<div style="border:1px solid var(--line);border-radius:14px;padding:16px"><div class="row"><div><b>${esc(a.title)}</b><div class="mini">${t(a.subject)} · ${t('due')}: ${esc(a.due)}</div></div>${badge(pct(a.completed.length,data.students.length)+'% '+t('completion'))}</div><div style="margin:12px 0">${bar(pct(a.completed.length,data.students.length))}</div><button class="btn secondary sm" onclick="editAssignment(${a.id})">${t('update')}</button></div>`).join('')}</div></section>`},insights(){return `<div class="grid2"><section class="card"><div class="cardhead"><h2>${t('classmap')}</h2>${badge(data.students.length+' '+t('students'))}</div>${mapView()}</section><section class="card"><div class="cardhead"><h2>${t('recommendations')}</h2></div><div class="stack">${data.students.slice().sort((a,b)=>avg(a)-avg(b)).map(s=>`<div class="row"><div><b>${esc(s.name)}</b><div class="mini">${insight(s)}</div></div>${badge(avg(s)+'%',level(s)==='low'?'red':level(s)==='mid'?'amber':'')}</div>`).join('<div class="line"></div>')}</div></section></div><p class="footnote">Learning indicators only: never diagnose a student or infer abilities from appearance. Teachers should verify every recommendation.</p>`}};
function mapView(){return `<div class="tablewrap"><table style="min-width:420px"><thead><tr><th>${t('name')}</th>${['math','reading','science'].map(x=>`<th>${t(x)}</th>`).join('')}</tr></thead><tbody>${data.students.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td>${['math','reading','science'].map(k=>`<td><span style="display:inline-block;min-width:55px;text-align:center;padding:8px;border-radius:9px;background:${s[k]<60?'#fbe4e2':s[k]<75?'#fff0d6':'#dceee8'};font-weight:800;color:#3d4c50">${s[k]}%</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function bindPage(){if(page==='students')$('#search').oninput=e=>$('#studentResults').innerHTML=studentTable(data.students.filter(s=>s.name.toLowerCase().includes(e.target.value.toLowerCase())));if(page==='attendance'){let el=$('#attDate');const fill=()=>{$('#attList').innerHTML=`<div class="stack">${data.students.map(s=>`<div class="row" style="padding:10px;border-bottom:1px solid var(--line)"><b>${esc(s.name)}</b><select style="width:auto" data-att="${s.id}">${['present','absent','late'].map(v=>`<option value="${v}" ${((data.attendance[el.value]||{})[s.id]||'present')===v?'selected':''}>${t(v)}</option>`).join('')}</select></div>`).join('')}</div>`};el.onchange=fill;fill();$('#saveAtt').onclick=()=>{data.attendance[el.value]=Object.fromEntries([...document.querySelectorAll('[data-att]')].map(x=>[x.dataset.att,x.value]));save();toast(t('save'))}}}
function go(x){page=x;render()}
function editStudent(id){let s=data.students.find(s=>s.id===id);if(!s)return;openModal(`<form id="studentForm" class="formgrid">${field('name',t('name'),'text',s.name)}${['math','reading','science'].map(k=>field(k,t(k),'number',s[k])).join('')}<div class="actions field full"><button class="btn" type="submit">${t('save')}</button><button type="button" class="btn warn" id="deleteStudent">${t('delete')}</button></div></form>`);$('#studentForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(s,{name:String(f.get('name')).trim(),math:Math.min(100,+f.get('math')),reading:Math.min(100,+f.get('reading')),science:Math.min(100,+f.get('science'))});save();closeModal();render();toast(t('save'))};$('#deleteStudent').onclick=()=>{if(confirm(t('delete')+'?')){data.students=data.students.filter(x=>x.id!==id);data.assignments.forEach(a=>a.completed=a.completed.filter(i=>i!==id));save();closeModal();render()}}}
function addNew(){if(page==='assignments')return newAssignment();openModal(`<form id="studentForm" class="formgrid">${field('name',t('name'))}${['math','reading','science'].map(k=>field(k,t(k),'number','70')).join('')}<div class="field full"><button class="btn" type="submit">${t('save')}</button></div></form>`);$('#studentForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.students.push({id:Date.now(),name:String(f.get('name')).trim(),math:Math.min(100,+f.get('math')),reading:Math.min(100,+f.get('reading')),science:Math.min(100,+f.get('science'))});save();closeModal();render();toast(t('save'))}}
function newAssignment(){openModal(`<form id="assignmentForm" class="formgrid">${field('title',t('assignment'))}${field('subject',t('topic'),'select','math',['math','reading','science'].map(k=>[k,t(k)]))}${field('due',t('due'),'date',new Date().toISOString().slice(0,10))}<div class="field full"><button class="btn">${t('save')}</button></div></form>`);$('#assignmentForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.assignments.unshift({id:Date.now(),title:String(f.get('title')),subject:String(f.get('subject')),due:String(f.get('due')),completed:[],scores:{}});save();closeModal();render()}}
function editAssignment(id){let a=data.assignments.find(x=>x.id===id);openModal(`<div class="stack">${data.students.map(s=>`<label class="row" style="padding:7px"><span>${esc(s.name)}</span><input style="width:18px;height:18px" type="checkbox" data-complete="${s.id}" ${a.completed.includes(s.id)?'checked':''}></label>`).join('')}</div><div class="actions"><button class="btn warn" id="removeAssignment">${t('delete')}</button><button class="btn" id="saveAssignment">${t('save')}</button></div>`);$('#saveAssignment').onclick=()=>{a.completed=[...document.querySelectorAll('[data-complete]:checked')].map(x=>+x.dataset.complete);save();closeModal();render()};$('#removeAssignment').onclick=()=>{if(confirm(t('delete')+'?')){data.assignments=data.assignments.filter(x=>x.id!==id);save();closeModal();render()}}}
function resetDemo(){if(confirm(t('clear')+'?')){data=structuredClone(SEED);save();render()}}
function exportCSV(){csvDownload([['Student','Mathematics','Reading','Science','Mastery','Attendance','Completion'],...data.students.map(s=>[s.name,s.math,s.reading,s.science,avg(s),attPct(s.id),completion(s.id)])],'class_pulse_students')}
window.importClassPulseStudents=rows=>{const key=name=>String(name).normalize('NFKC').trim().toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');const next=data.students.map(s=>({...s}));const matches=new Map();next.forEach((s,i)=>{const k=key(s.name);matches.set(k,[...(matches.get(k)||[]),i])});let added=0,updated=0,nextId=Math.max(Date.now(),...next.map(s=>Number(s.id)||0))+1;for(const row of rows){const found=matches.get(key(row.name))||[];if(found.length>1)throw new Error(`More than one existing student is named "${row.name}".`);if(found.length){next[found[0]]={...next[found[0]],math:row.math,reading:row.reading,science:row.science};updated++}else{const student={id:nextId++,...row};matches.set(key(row.name),[next.length]);next.push(student);added++}}data.students=next;save();render();return{added,updated}};
window.showClassPulseToast=toast;
init();
</script><script src="csv-import.js"></script></body></html>
